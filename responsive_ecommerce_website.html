<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ShopEase | Online Store</title>
<style>
:root{--ink:#18212f;--muted:#687386;--brand:#6c4df6;--soft:#f5f4ff;--line:#e8eaf0}
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;color:var(--ink);background:#fff}
header{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--line);padding:15px 5%;display:flex;align-items:center;gap:22px}
.logo{font-size:25px;font-weight:800;color:var(--brand);white-space:nowrap}.logo span{color:var(--ink)}
.search{flex:1;display:flex;background:#f5f6fa;border-radius:12px;padding:0 14px;align-items:center}.search input{width:100%;border:0;background:transparent;padding:13px;outline:0;font-size:15px}
.cart-btn,.primary{border:0;background:var(--brand);color:#fff;border-radius:11px;padding:12px 17px;font-weight:700;cursor:pointer}.cart-btn{white-space:nowrap}
.hero{margin:28px 5%;padding:48px 6%;border-radius:22px;background:linear-gradient(120deg,#eeeaff,#f9f7ff);display:flex;align-items:center;justify-content:space-between;gap:25px;min-height:260px}
.hero h1{font-size:clamp(30px,5vw,48px);margin:0 0 12px}.hero p{color:var(--muted);font-size:17px;line-height:1.6;max-width:480px}.hero-art{font-size:100px}
main{padding:10px 5% 60px}.section-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.section-head h2{font-size:27px}
.filters{display:flex;gap:9px;flex-wrap:wrap;margin:12px 0 24px}.filter{padding:9px 15px;border:1px solid var(--line);border-radius:30px;background:#fff;cursor:pointer}.filter.active{background:var(--brand);color:#fff;border-color:var(--brand)}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px}.product{border:1px solid var(--line);border-radius:16px;overflow:hidden;transition:.2s}.product:hover{transform:translateY(-4px);box-shadow:0 10px 25px #1c244010}
.product-img{height:175px;display:grid;place-items:center;background:#f7f7fb;font-size:76px}.product-info{padding:15px}.tag{font-size:12px;color:var(--brand);font-weight:700;text-transform:uppercase}.product h3{margin:8px 0;font-size:17px}.price{font-size:19px;font-weight:800;margin:10px 0}.product button{width:100%}
.drawer-bg{display:none;position:fixed;inset:0;background:#10182888;z-index:10}.drawer{position:absolute;right:0;top:0;height:100%;width:min(420px,100%);background:#fff;padding:23px;overflow:auto}.drawer-bg.show{display:block}.drawer-head{display:flex;justify-content:space-between;align-items:center}.close{border:0;background:#eee;border-radius:8px;padding:8px 12px;cursor:pointer}.cart-item{display:flex;justify-content:space-between;gap:10px;padding:15px 0;border-bottom:1px solid var(--line)}.cart-item small{display:block;color:var(--muted);margin-top:5px}.qty{display:flex;gap:8px;align-items:center}.qty button{border:1px solid var(--line);background:white;border-radius:6px;padding:4px 9px;cursor:pointer}.total{display:flex;justify-content:space-between;font-size:20px;font-weight:800;margin:22px 0}.empty{text-align:center;color:var(--muted);padding:40px 0}
footer{text-align:center;background:#f7f7fb;padding:25px;color:var(--muted)}
@media(max-width:900px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.hero-art{font-size:75px}}
@media(max-width:560px){header{padding:12px 4%;gap:10px;flex-wrap:wrap}.logo{font-size:21px}.search{order:3;flex-basis:100%}.cart-btn{margin-left:auto;padding:10px 12px}.hero{margin:18px 4%;padding:30px 7%;min-height:220px}.hero-art{font-size:55px}main{padding:5px 4% 40px}.grid{gap:12px}.product-img{height:130px;font-size:58px}.product-info{padding:11px}.product h3{font-size:15px}.price{font-size:17px}.section-head h2{font-size:23px}}
</style>
</head>
<body>
<header>
  <div class="logo">Shop<span>Ease.</span></div>
  <label class="search"><span>⌕</span><input id="search" type="search" placeholder="Search products..." aria-label="Search products"></label>
  <button class="cart-btn" onclick="openCart()">🛒 Cart (<span id="cartCount">0</span>)</button>
</header>
<section class="hero">
  <div><h1>Find your everyday favourites.</h1><p>Discover useful products, great prices and a simple shopping experience — all in one place.</p><button class="primary" onclick="document.getElementById('shop').scrollIntoView({behavior:'smooth'})">Shop Now →</button></div>
  <div class="hero-art" aria-hidden="true">🛍️</div>
</section>
<main id="shop">
  <div class="section-head"><h2>Featured Products</h2><span id="resultCount" style="color:#687386"></span></div>
  <div class="filters" id="filters"></div>
  <div class="grid" id="products"></div>
</main>
<div class="drawer-bg" id="drawerBg" onclick="if(event.target===this)closeCart()">
 <aside class="drawer">
  <div class="drawer-head"><h2>Your Shopping Cart</h2><button class="close" onclick="closeCart()">✕</button></div>
  <div id="cartItems"></div>
  <div class="total"><span>Total</span><span id="cartTotal">₹0</span></div>
  <button class="primary" style="width:100%" onclick="checkout()">Proceed to Checkout</button>
 </aside>
</div>
<footer>© 2026 ShopEase. Demo e-commerce website.</footer>
<script>
const products=[
{id:1,name:"Wireless Headphones",category:"Electronics",price:1499,emoji:"🎧",desc:"Clear sound and comfortable fit"},
{id:2,name:"Smart Watch",category:"Electronics",price:2299,emoji:"⌚",desc:"Stay connected every day"},
{id:3,name:"Running Shoes",category:"Fashion",price:1899,emoji:"👟",desc:"Comfort for every step"},
{id:4,name:"Travel Backpack",category:"Accessories",price:999,emoji:"🎒",desc:"Room for all your essentials"},
{id:5,name:"Classic Sunglasses",category:"Accessories",price:699,emoji:"🕶️",desc:"A stylish everyday look"},
{id:6,name:"Cotton T-Shirt",category:"Fashion",price:499,emoji:"👕",desc:"Soft and easy to wear"},
{id:7,name:"Desk Lamp",category:"Home",price:849,emoji:"💡",desc:"Brighten your workspace"},
{id:8,name:"Coffee Mug",category:"Home",price:299,emoji:"☕",desc:"Your favourite morning cup"}
];
let cart=JSON.parse(localStorage.getItem("shopease-cart")||"{}"),category="All";
const money=n=>"₹"+n.toLocaleString("en-IN");
function save(){localStorage.setItem("shopease-cart",JSON.stringify(cart));updateCartCount()}
function updateCartCount(){document.getElementById("cartCount").textContent=Object.values(cart).reduce((a,b)=>a+b,0)}
function renderFilters(){let cats=["All",...new Set(products.map(p=>p.category))];document.getElementById("filters").innerHTML=cats.map(c=>`<button class="filter ${category===c?'active':''}" onclick="setCategory('${c}')">${c}</button>`).join("")}
function setCategory(c){category=c;renderFilters();renderProducts()}
function renderProducts(){let q=document.getElementById("search").value.toLowerCase();let list=products.filter(p=>(category==="All"||p.category===category)&&(p.name.toLowerCase().includes(q)||p.category.toLowerCase().includes(q)));document.getElementById("resultCount").textContent=list.length+" products";document.getElementById("products").innerHTML=list.length?list.map(p=>`<article class="product"><div class="product-img">${p.emoji}</div><div class="product-info"><span class="tag">${p.category}</span><h3>${p.name}</h3><small style="color:#687386">${p.desc}</small><div class="price">${money(p.price)}</div><button class="primary" onclick="addToCart(${p.id})">Add to Cart</button></div></article>`).join(""):'<p>No products found. Try another search.</p>'}
function addToCart(id){cart[id]=(cart[id]||0)+1;save();if(document.getElementById("drawerBg").classList.contains("show"))renderCart()}
function openCart(){document.getElementById("drawerBg").classList.add("show");renderCart()}
function closeCart(){document.getElementById("drawerBg").classList.remove("show")}
function changeQty(id,delta){cart[id]=(cart[id]||0)+delta;if(cart[id]<=0)delete cart[id];save();renderCart()}
function renderCart(){let entries=Object.entries(cart);document.getElementById("cartItems").innerHTML=entries.length?entries.map(([id,qty])=>{let p=products.find(x=>x.id==id);return `<div class="cart-item"><div><b>${p.emoji} ${p.name}</b><small>${money(p.price)} each</small><small>Subtotal: ${money(p.price*qty)}</small></div><div class="qty"><button onclick="changeQty(${id},-1)">−</button>${qty}<button onclick="changeQty(${id},1)">+</button></div></div>`}).join(""):'<div class="empty">Your cart is empty 🛒<br><br>Add a product to get started.</div>';let total=entries.reduce((s,[id,q])=>s+products.find(p=>p.id==id).price*q,0);document.getElementById("cartTotal").textContent=money(total)}
function checkout(){if(!Object.keys(cart).length){alert("Your cart is empty. Please add a product first.");return}alert("Demo checkout successful! This project does not process real payments.");cart={};save();renderCart();closeCart()}
document.getElementById("search").addEventListener("input",renderProducts);
renderFilters();renderProducts();updateCartCount();
</script>
</body>
</html>
